# Wails v3 project info (used by wails3 update build-assets and wails3 doctor).
version: '3'

info:
  companyName: "lugvitc"
  productName: "amazingwhats"
  productIdentifier: "net.lugvitc.amazingwhats"
  description: "An unofficial WhatsApp client."
  copyright: "(c) lugvitc"
  comments: "An unofficial WhatsApp client."
  version: "1.0.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task common:install:frontend:deps
      type: once
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: go mod tidy
      type: blocking
    - cmd: wails3 task build
      type: blocking
    - cmd: wails3 task run
      type: primary

fileAssociations:
  # none
