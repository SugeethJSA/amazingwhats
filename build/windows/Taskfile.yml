version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Windows
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          PRODUCTION:
            ref: .PRODUCTION
      - task: common:generate:icons
    cmds:
      - task: generate:syso
      - go build {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="{{.LDFLAGS}} -H windowsgui"{{else}}{{if .EXTRA_TAGS}}-tags {{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
      OUTPUT: '{{.OUTPUT | default .DEFAULT_OUTPUT}}'
      LDFLAGS: '{{.LDFLAGS | default "-w -s"}}'
    env:
      GOOS: windows
      # mattn/go-sqlite3 requires cgo; CI puts MSYS2 ucrt64 gcc on PATH.
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  generate:syso:
    summary: Generates the Windows .syso file
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  package:installer:
    summary: Builds the per-user NSIS installer from the production exe (D-PKG-002)
    # Task runs from the repository root; NSIS chdirs to the .nsi folder, so
    # APP_EXE and the OutFile path are relative to build/windows/installer/
    # (../../.. = repo root). The installer therefore lands in the repo-root
    # bin/ dir, alongside the portable exe.
    # Depends on build so makensis always sees a fresh production binary.
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - makensis /DAPP_EXE=..\..\..\bin\whats4linux.exe build/windows/installer/installer.nsi
      # Fail loudly if makensis silently skipped/produced nothing. The path is
      # the real repo-root bin/ output (Task's execution dir is the repo root).
      - cmd: powershell -NoProfile -Command "if (-not (Test-Path -LiteralPath '{{.BIN_DIR}}/whats4linux-setup.exe' -PathType Leaf)) { Write-Error 'makensis did not produce bin/whats4linux-setup.exe'; exit 1 }; Write-Host 'Installer built at {{.BIN_DIR}}/whats4linux-setup.exe'"
        platforms: [windows]
      - cmd: test -f {{.BIN_DIR}}/whats4linux-setup.exe && echo "Installer built at {{.BIN_DIR}}/whats4linux-setup.exe"
        platforms: [linux, darwin]

  package:
    summary: Production build + Windows installer (portable exe stays in bin/)
    deps:
      - task: package:installer

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
