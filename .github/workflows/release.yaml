name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    # Nightly build at 02:00 UTC
    - cron: "0 2 * * *"

# D-AUD-009a: nightly status is derived inline from github.event_name at each
# use site. Never read it from a string-valued env var: "false" is truthy in
# expression && chains and would stamp manual runs as nightly.
concurrency:
  group: release-nightly
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check nightly state
        id: check
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch all tags: a missing `nightly` tag is expected on first run and
          # is handled by the rev-parse branch below, while a network/auth failure
          # still fails the job under set -euo pipefail.
          git fetch origin --tags --force

          if git rev-parse --verify -q nightly >/dev/null; then
            nightly_sha="$(git rev-list -n 1 nightly)"
          else
            nightly_sha=""
          fi

          if [ "$GITHUB_SHA" = "$nightly_sha" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'

    strategy:
      fail-fast: true
      matrix:
        include:
         - os: ubuntu-24.04
           platform: linux/amd64
           binary: amazingwhats-linux-amd64.AppImage
           artifact: amazingwhats-linux-amd64
            # Sole updater-matching asset for this platform.
           updater_asset: amazingwhats-linux-amd64.AppImage
           linux: true

         - os: windows-latest
           platform: windows/amd64
           binary: amazingwhats-windows.exe
           artifact: amazingwhats-windows-amd64
            # Only this ZIP matches the updater; the raw exe above has no arch token.
           updater_asset: amazingwhats-windows-amd64.zip
           linux: false

         - os: macos-latest
           platform: darwin/amd64
           binary: amazingwhats-darwin
           artifact: amazingwhats-macos-amd64
            # Only this ZIP matches the updater; the raw bundle has no arch token.
           updater_asset: amazingwhats-darwin-amd64.zip
           linux: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Linux-only system deps (v3 defaults to GTK4 + WebKitGTK 6.0)
      - name: Install Linux dependencies
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev \
            pkg-config \
            build-essential

      # go-sqlite3 needs cgo; windows-latest ships MSYS2 at C:\msys64.
      - name: Add MSYS2 compiler to PATH (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: echo "/c/msys64/ucrt64/bin" >> $GITHUB_PATH

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Install Wails 3
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Verify Wails 3 toolchain
        run: wails3 doctor

      - name: Verify generated bindings are current
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          wails3 generate bindings -ts
          git diff --exit-code -- frontend/bindings

      - name: Build binaries
        shell: bash
        run: |
          # D-AUD-009a: gate nightly flags on the event, not on a string env var.
          wails3 build PRODUCTION=true ARCH=amd64 \
            ${{ github.event_name == 'schedule' && 'LDFLAGS="-s -w -X main.version=v1.0.0 -X main.buildType=nightly"' || '' }}

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv bin/amazingwhats.exe "bin/${{ matrix.binary }}"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            # Produce bin/amazingwhats.app for the ditto step below.
            wails3 task darwin:create:app:bundle
          fi

      - name: Package Windows binary with AGPL license (zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # D-AUD-009d: AGPL-3.0 requires the license text to ship with the binary.
          Copy-Item LICENSE bin/LICENSE
          $zipName = '${{ matrix.updater_asset }}'
          Compress-Archive -Path "bin/${{ matrix.binary }}", "bin/LICENSE" -DestinationPath "bin/$zipName"
          Write-Host "Created bin/$zipName"

      # D-PKG-003: NSIS is only needed on Windows. Chocolatey ships on
      # windows-latest; make the NSIS directory explicit as a fallback in case
      # the package shim is not on PATH in a given runner image.
      - name: Install NSIS (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS",
            "$env:ProgramFiles\NSIS",
            "$env:ChocolateyInstall\lib\nsis\tools"
          )
          $nsisDir = $candidates | Where-Object { Test-Path (Join-Path $_ 'makensis.exe') } | Select-Object -First 1
          if (-not $nsisDir) { throw "makensis.exe not found after choco install nsis" }
          echo "$nsisDir" >> $env:GITHUB_PATH
          Write-Host "NSIS directory: $nsisDir"

      # D-PKG-003: run makensis directly rather than `wails3 task
      # package:installer`, because that task declares a `build` dependency and
      # would silently rebuild the exe WITHOUT the nightly LDFLAGS injected by
      # the "Build binaries" step above.
      - name: Build Windows NSIS installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $appExe = '..\..\..\bin\${{ matrix.binary }}'
          # installer.nsi's OutFile is resolved relative to the .nsi folder;
          # create both candidate output directories before invoking makensis.
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          New-Item -ItemType Directory -Force -Path build/bin | Out-Null
          makensis "/DAPP_EXE=$appExe" build/windows/installer/installer.nsi

          $expected = Join-Path (Get-Location) 'bin/amazingwhats-setup.exe'
          $alternate = Join-Path (Get-Location) 'build/bin/amazingwhats-setup.exe'
          if ((Test-Path $alternate) -and -not (Test-Path $expected)) {
            Move-Item -Force $alternate $expected
          }
          if (-not (Test-Path $expected)) {
            throw "NSIS did not produce bin/amazingwhats-setup.exe (also checked build/bin/amazingwhats-setup.exe)"
          }
          Get-Item $expected | Select-Object FullName, Length

      - name: Upload Windows installer artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          # The FILE stays amazingwhats-setup.exe (no platform/arch tokens) so
          # the updater's DefaultAssetMatcher never selects it. Only the CI
          # artifact name carries the nightly suffix, consistent with the
          # other matrix artifacts.
          name: amazingwhats-setup${{ github.event_name == 'schedule' && '-nightly' || '' }}
          path: bin/amazingwhats-setup.exe
          if-no-files-found: error

      - name: Download appimagetool
        if: matrix.os == 'ubuntu-24.04'
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p packaging/AppImage/AppDir/usr/bin
          mv bin/amazingwhats packaging/AppImage/AppDir/usr/bin/amazingwhats
          chmod +x packaging/AppImage/AppDir/usr/bin/*
          # Ship the AGPL-3.0 license text inside the AppDir as required by the license.
          mkdir -p packaging/AppImage/AppDir/usr/share/licenses/amazingwhats
          cp LICENSE packaging/AppImage/AppDir/usr/share/licenses/amazingwhats/LICENSE
          cd packaging/AppImage/AppDir
          # Keep the directory icon in sync with the real app icon.
          cp amazingwhats.png .DirIcon
          for f in .DirIcon amazingwhats.desktop amazingwhats.png; do
            if [ -L "$f" ]; then cp -L "$f" "$f.tmp" && mv "$f.tmp" "$f"; fi
          done
          cd ../../..
          ./appimagetool-x86_64.AppImage packaging/AppImage/AppDir
          mv amazingwhats-x86_64.AppImage "bin/${{matrix.binary}}"

      - name: Zip macOS bundle
        if: matrix.os == 'macos-latest'
        run: |
          # Include the AGPL-3.0 license text inside the .app bundle.
          mkdir -p bin/amazingwhats.app/Contents/Resources
          cp LICENSE bin/amazingwhats.app/Contents/Resources/LICENSE
          cd bin
          ditto -c -k --sequesterRsrc --keepParent \
            amazingwhats.app \
            "${{ matrix.updater_asset }}"

      # D-PKG-003: one checksum LINE per platform, produced with the native
      # tool so no cross-platform hashing helper is needed. The publish job
      # concatenates these three fragments into the single SHA256SUMS asset.
      - name: Generate checksum line (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          asset="bin/${{ matrix.updater_asset }}"
          # updater_asset already carries the .zip extension where needed.
          test -f "$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd bin && sha256sum "$(basename "$asset")") > checksum.txt
          else
            # stock macOS ships shasum, not GNU sha256sum (same output format).
            (cd bin && shasum -a 256 "$(basename "$asset")") > checksum.txt
          fi
          cat checksum.txt

      - name: Generate checksum line (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $asset = 'bin/${{ matrix.updater_asset }}'
          if (-not (Test-Path $asset)) { throw "Missing portable asset: $asset" }
          $hash = (Get-FileHash -Path $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $name = Split-Path $asset -Leaf
          # WriteAllText with an explicit LF: Set-Content would append CRLF,
          # leaving "\r" inside the filename and breaking `sha256sum -c`.
          [IO.File]::WriteAllText('checksum.txt', "$hash  $name`n")
          Get-Content checksum.txt

      - name: Upload checksum fragment
        uses: actions/upload-artifact@v4
        with:
          name: checksum-${{ matrix.artifact }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
          path: checksum.txt
          if-no-files-found: error

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
          path: bin/${{ matrix.binary }}*

      - name: Upload macOS updater zip
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-portable${{ github.event_name == 'schedule' && '-nightly' || '' }}
          path: bin/${{ matrix.updater_asset }}
          if-no-files-found: error

      - name: Upload licensed Windows zip
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-licensed${{ github.event_name == 'schedule' && '-nightly' || '' }}
          path: bin/${{ matrix.updater_asset }}

  publish-nightly:
    if: github.event_name == 'schedule' && needs.prepare.outputs.should_build == 'true'
    needs: [build, prepare]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # D-PKG-003: merge the three native-tool fragments into ONE sidecar.
      # Remove the fragment directories afterwards so `dist/**/*` cannot
      # publish them as stray release assets. SHA256SUMS is published in the
      # same softprops call as the binaries, so the release is atomic.
      - name: Assemble SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          : > SHA256SUMS
          for f in dist/checksum-*/checksum.txt; do
            if [ ! -f "$f" ]; then
              echo "Missing checksum fragment: $f" >&2
              exit 1
            fi
            cat "$f" >> SHA256SUMS
          done
          sort -o SHA256SUMS SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 3
          if grep -qi 'setup' SHA256SUMS; then
            echo "Installer leaked into SHA256SUMS" >&2
            exit 1
          fi
          rm -rf dist/checksum-*/

      # D-PKG-003: prove the sidecar is usable BEFORE publishing. The fragments
      # contain basenames only, so stage the three downloaded portable assets
      # next to SHA256SUMS and let `sha256sum -c` verify the actual bytes.
      - name: Verify SHA256SUMS against downloaded assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify && mkdir verify
          cp SHA256SUMS verify/
          for name in amazingwhats-linux-amd64.AppImage \
                      amazingwhats-windows-amd64.zip \
                      amazingwhats-darwin-amd64.zip; do
            src="$(find dist -type f -name "$name" -print -quit)"
            if [ -z "$src" ]; then
              echo "Portable asset missing from downloaded artifacts: $name" >&2
              exit 1
            fi
            cp "$src" "verify/$name"
          done
          (cd verify && sha256sum -c SHA256SUMS)

      - name: Update nightly tag
        run: |
          git tag -f nightly "${{ github.sha }}"
          git push -f origin nightly

      - name: Publish nightly GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Nightly Build
          prerelease: true
          files: |
            dist/**/*
            SHA256SUMS
