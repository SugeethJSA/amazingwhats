name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    # Nightly build at 02:00 UTC
    - cron: "0 2 * * *"

env:
  IS_NIGHTLY: ${{ github.event_name == 'schedule' }}

concurrency:
  group: release-nightly
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check nightly state
        id: check
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch all tags: a missing `nightly` tag is expected on first run and
          # is handled by the rev-parse branch below, while a network/auth failure
          # still fails the job under set -euo pipefail.
          git fetch origin --tags --force

          if git rev-parse --verify -q nightly >/dev/null; then
            nightly_sha="$(git rev-list -n 1 nightly)"
          else
            nightly_sha=""
          fi

          if [ "$GITHUB_SHA" = "$nightly_sha" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'

    strategy:
      fail-fast: true
      matrix:
        include:
         - os: ubuntu-24.04
           platform: linux/amd64
           binary: Whats4Linux-Linux-x86_64.AppImage
           artifact: whats4linux-linux-amd64
           linux: true

         - os: windows-latest
           platform: windows/amd64
           binary: whats4linux-windows.exe
           artifact: whats4linux-windows-amd64
           linux: false

         - os: macos-latest
           platform: darwin/amd64
           binary: whats4linux-darwin
           artifact: whats4linux-macos-amd64
           linux: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Linux-only system deps (v3 defaults to GTK4 + WebKitGTK 6.0)
      - name: Install Linux dependencies
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev \
            pkg-config \
            build-essential

      # go-sqlite3 needs cgo; windows-latest ships MSYS2 at C:\msys64.
      - name: Add MSYS2 compiler to PATH (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: echo "/c/msys64/ucrt64/bin" >> $GITHUB_PATH

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Install Wails 3
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Build binaries
        shell: bash
        run: |
          wails3 build PRODUCTION=true ARCH=amd64 \
            ${{ env.IS_NIGHTLY && 'LDFLAGS="-s -w -X main.version=v1.0.0 -X main.buildType=nightly"' || '' }}

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv bin/whats4linux.exe "bin/${{ matrix.binary }}"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            # Produce bin/whats4linux.app for the ditto step below.
            wails3 task darwin:create:app:bundle
          fi

      - name: Download appimagetool
        if: matrix.os == 'ubuntu-24.04'
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p packaging/AppImage/AppDir/usr/bin
          mv bin/whats4linux packaging/AppImage/AppDir/usr/bin/whats4linux
          chmod +x packaging/AppImage/AppDir/usr/bin/*
          cd packaging/AppImage/AppDir
          for f in .DirIcon whats4linux.desktop whats4linux.png; do
            if [ -L "$f" ]; then cp -L "$f" "$f.tmp" && mv "$f.tmp" "$f"; fi
          done
          cd ../../..
          ./appimagetool-x86_64.AppImage packaging/AppImage/AppDir
          mv Whats4Linux-x86_64.AppImage "bin/${{matrix.binary}}"

      - name: Zip macOS bundle
        if: matrix.os == 'macos-latest'
        run: |
          cd bin
          ditto -c -k --sequesterRsrc --keepParent \
            whats4linux.app \
            "${{ matrix.binary }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}${{ env.IS_NIGHTLY && '-nightly' || '' }}
          path: bin/${{ matrix.binary }}*

  publish-nightly:
    if: github.event_name == 'schedule' && needs.prepare.outputs.should_build == 'true'
    needs: [build, prepare]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Update nightly tag
        run: |
          git tag -f nightly "${{ github.sha }}"
          git push -f origin nightly

      - name: Publish nightly GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Nightly Build
          prerelease: true
          files: dist/**/*
