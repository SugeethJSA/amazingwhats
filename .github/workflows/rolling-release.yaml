name: Rolling Release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: rolling-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check existing rolling release for this commit
        id: check
        shell: bash
        run: |
          set -euo pipefail

          # Fail the job on fetch error; never default to "release" on missing tag data.
          git fetch origin --tags --force

          short_sha="$(git rev-parse --short HEAD)"
          if git tag --list "v*-${short_sha}" | grep -q .; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
         - os: ubuntu-24.04
           platform: linux/amd64
           binary: Whats4Linux-Linux-x86_64.AppImage
           artifact: whats4linux-linux-amd64
           linux: true

         - os: windows-latest
           platform: windows/amd64
           binary: whats4linux-windows-x86_64.exe
           artifact: whats4linux-windows-amd64
           linux: false

         - os: macos-latest
           platform: darwin/amd64
           binary: whats4linux-darwin-x86_64
           artifact: whats4linux-macos-amd64
           linux: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev \
            pkg-config \
            build-essential

      # go-sqlite3 needs cgo; windows-latest ships MSYS2 at C:\msys64.
      - name: Add MSYS2 compiler to PATH (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: echo "/c/msys64/ucrt64/bin" >> $GITHUB_PATH

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Install Wails 3
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Verify Wails 3 toolchain
        run: wails3 doctor

      - name: Verify generated bindings are current
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          wails3 generate bindings -ts
          git diff --exit-code -- frontend/bindings

      - name: Build version info
        id: version
        shell: bash
        run: |
          VERSION="v$(date -u +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build binaries (Linux / macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          wails3 build PRODUCTION=true ARCH=amd64 \
            LDFLAGS="-s -w -X main.version=${{ steps.version.outputs.version }} -X main.commit=${{ steps.version.outputs.commit }} -X main.date=${{ steps.version.outputs.date }} -X main.buildType=release"

          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            # Produce bin/whats4linux.app for the ditto step below.
            wails3 task darwin:create:app:bundle
          fi

      - name: Build binaries (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          wails3 build PRODUCTION=true ARCH=amd64 \
            LDFLAGS="-s -w -X main.version=${{ steps.version.outputs.version }} -X main.commit=${{ steps.version.outputs.commit }} -X main.date=${{ steps.version.outputs.date }} -X main.buildType=release"
          mv bin/whats4linux.exe "bin/${{ matrix.binary }}"

      - name: Package Windows binary with AGPL license (zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # D-AUD-009d: AGPL-3.0 requires the license text to ship with the binary.
          Copy-Item LICENSE bin/LICENSE
          $zipName = [System.IO.Path]::GetFileNameWithoutExtension('${{ matrix.binary }}') + '.zip'
          Compress-Archive -Path "bin/${{ matrix.binary }}", "bin/LICENSE" -DestinationPath "bin/$zipName"
          Write-Host "Created bin/$zipName"

      - name: Download appimagetool
        if: matrix.os == 'ubuntu-24.04'
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p packaging/AppImage/AppDir/usr/bin
          mv bin/whats4linux packaging/AppImage/AppDir/usr/bin/whats4linux
          chmod +x packaging/AppImage/AppDir/usr/bin/*
          # Ship the AGPL-3.0 license text inside the AppDir as required by the license.
          mkdir -p packaging/AppImage/AppDir/usr/share/licenses/whats4linux
          cp LICENSE packaging/AppImage/AppDir/usr/share/licenses/whats4linux/LICENSE
          cd packaging/AppImage/AppDir
          for f in .DirIcon whats4linux.desktop whats4linux.png; do
            if [ -L "$f" ]; then cp -L "$f" "$f.tmp" && mv "$f.tmp" "$f"; fi
          done
          cd ../../..
          ./appimagetool-x86_64.AppImage packaging/AppImage/AppDir
          mv Whats4Linux-x86_64.AppImage "bin/${{matrix.binary}}"

      - name: Bundle macOS
        if: matrix.os == 'macos-latest'
        run: |
          if [ ! -d bin/whats4linux.app ]; then
            wails3 task darwin:create:app:bundle
          fi
          # Include the AGPL-3.0 license text inside the .app bundle.
          mkdir -p bin/whats4linux.app/Contents/Resources
          cp LICENSE bin/whats4linux.app/Contents/Resources/LICENSE
          cd bin
          ditto -c -k --sequesterRsrc --keepParent \
            whats4linux.app \
            "${{ matrix.binary }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/${{ matrix.binary }}*

      - name: Upload licensed Windows zip
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-licensed
          path: bin/whats4linux-windows-x86_64.zip

  release:
    needs: [build, prepare]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        shell: bash
        run: |
          VERSION="v$(date -u +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        shell: bash
        run: find dist -type f | sort

      - name: Create rolling release tag
        shell: bash
        run: |
          git tag -f ${{ steps.version.outputs.version }}
          git push -f origin ${{ steps.version.outputs.version }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Release ${{ steps.version.outputs.version }}"
          body: |
            Rolling release built from commit ${{ github.sha }}.

            ## Downloads
            - **Linux**: `Whats4Linux-Linux-x86_64.AppImage`
            - **Windows**: `whats4linux-windows-x86_64.zip` (binary + AGPL-3.0 LICENSE)
            - **macOS**: `whats4linux-darwin-x86_64.zip`
          files: dist/**/*
